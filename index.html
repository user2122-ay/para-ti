<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para ti 🌼</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Fraunces:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
:root{--noche:#070b1e;--hoja:#1a1c4a;--sol:#f7c914;--miel:#e3a600;--petalo:#fff1b8}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(ellipse at 15% 8%,#2d2166 0%,transparent 55%),radial-gradient(ellipse at 85% 75%,#10404f 0%,transparent 55%),var(--noche);background-attachment:fixed;color:var(--petalo);font-family:'Fraunces',Georgia,serif;overflow-x:hidden;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#cielo{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#petalos{z-index:1;position:fixed;inset:0;pointer-events:none;overflow:hidden}
.p{position:absolute;top:-40px;opacity:.95;background-repeat:no-repeat;background-size:contain;animation:cae linear infinite}
@keyframes cae{to{transform:translateY(110vh) rotate(540deg)}}
main{position:relative;z-index:2;max-width:32rem;margin:0 auto;padding:2rem 1.5rem 4rem;min-height:100%;display:flex;flex-direction:column;align-items:center;text-align:center}
#inicio{margin:auto 0;padding-top:11rem;display:flex;flex-direction:column;align-items:center;gap:1.4rem}
.flor{font-size:5rem}
#escena{width:100%;height:13.5rem;display:flex;justify-content:center;align-items:flex-end;overflow:hidden}
#grupo{display:flex;align-items:flex-end;animation:llega 2.8s ease-out both}
@keyframes llega{from{transform:translateX(70vw)}to{transform:none}}
#persona{display:block;animation:bob .5s ease-in-out 6}
#persona svg{height:12rem;width:auto;display:block}
.leg{transform-box:view-box;animation:paso .5s ease-in-out 6 alternate}
.leg.r{animation-direction:alternate-reverse}
@keyframes paso{from{transform:rotate(-20deg)}to{transform:rotate(20deg)}}
@keyframes bob{50%{transform:translateY(-5px)}}
#ramo{display:block;margin-left:-3.9rem;margin-bottom:6rem;transition:transform 1.4s ease-in-out,filter 1.4s}
#escena.entrega #ramo{transform:translate(-2.4rem,-2.2rem) scale(1.7);filter:drop-shadow(0 0 20px var(--sol))}
#escena.entrega #persona{opacity:0;transition:opacity 1s}
#abrir{opacity:0;pointer-events:none;transition:opacity 1s}
#abrir.ok{opacity:1;pointer-events:auto}
#ramo svg{width:5rem;height:auto;display:block}
#ramoFin svg{width:4.5rem;height:auto;display:block;margin:0 auto}
@keyframes mece{50%{transform:rotate(8deg) scale(1.06)}}
h1{font-family:'Caveat',cursive;font-size:3rem;color:var(--sol);line-height:1.1}
#inicio p{font-size:1.1rem;opacity:.9}
button{font:inherit;font-size:1.15rem;background:var(--sol);color:var(--noche);border:0;border-radius:999px;padding:.9rem 2rem;cursor:pointer;font-weight:400}
button:focus-visible{outline:3px solid var(--petalo);outline-offset:3px}
#carta{display:none;width:100%;padding-top:2rem}
#carta h2{font-family:'Caveat',cursive;font-size:2.4rem;color:var(--sol);margin-bottom:1.5rem}
.l{font-size:1.25rem;line-height:1.7;font-style:italic;margin-bottom:1.1rem;opacity:0;transform:translateY(8px);transition:opacity 1s,transform 1s}
.l.v{opacity:1;transform:none}
#firma{font-family:'Caveat',cursive;font-size:2rem;color:var(--sol);margin-top:1.5rem;opacity:0;transition:opacity 1.5s}
#firma.v{opacity:1}
#otra{display:none;margin-top:2rem;background:transparent;color:var(--petalo);border:1px solid var(--petalo);font-size:1rem;padding:.6rem 1.4rem}
#buzon{display:none;margin-top:2.5rem;width:100%}
#buzon h3{font-family:'Caveat',cursive;font-size:2rem;color:var(--sol);font-weight:600}
#buzon p.sub{margin:.3rem 0 1rem;opacity:.85}
#nota{margin-top:1.2rem;padding:1.2rem;border:1px dashed var(--sol);border-radius:14px;font-style:italic;font-size:1.2rem;line-height:1.6;opacity:0}
#nota:empty{display:none}
#nota.v{opacity:1;animation:sale .6s ease-out}
@keyframes sale{from{opacity:0;transform:translateY(14px) scale(.96)}}
@media (prefers-reduced-motion:reduce){.p,#grupo,#persona,.leg{animation:none}}
</style>
</head>
<body>
<canvas id="cielo"></canvas>
<div id="petalos" aria-hidden="true"></div>
<main>
  <section id="inicio">
    <div id="escena"><div id="grupo"><span id="persona"></span><span id="ramo"></span></div></div>
    <h1 id="titulo"></h1>
    <p>Alguien viene en camino con algo para ti…<br>Sube el volumen.</p>
    <button id="abrir">Recibir mi ramo</button>
  </section>
  <section id="carta">
    <div id="ramoFin"></div>
    <h2 id="saludo"></h2>
    <div id="lineas"></div>
    <p id="firma"></p>
    <button id="otra">Escuchar otra vez</button>
    <div id="buzon">
      <h3>Buzón de cositas bonitas 💌</h3>
      <p class="sub">Toca el sobre cada vez que necesites ánimo.</p>
      <button id="sobre">Abrir un sobre</button>
      <p id="nota" aria-live="polite"></p>
    </div>
  </section>
</main>
<script>
/* ====== EDITA SOLO ESTO ====== */
const NOMBRE = "Vanessa";
const TU_NOMBRE = "Anthony";
const MENSAJE = [
  "Aunque no te regalé rosas de verdad, quise hacerte algo con mucho cariño.",
  "Y sí, esto no llegó a tiempo. El día de las flores amarillas ya pasó.",
  "Pero eso no cambia nada: sigues siendo una persona muy especial para mí.",
  "Tú eres como esas flores amarillas: llegas y todo a tu alrededor se ilumina.",
  "Gracias por estar, por escucharme y por hacerme reír hasta cuando no hay nada gracioso.",
  "Ojalá nunca olvides lo mucho que vales, y lo feliz que soy de tenerte en mi vida.",
  "Feliz día de las flores amarillas, aunque sea tarde. Te quiero muchísimo."
];
// Si grabas tu voz, sube el archivo a GitHub y pon aquí su nombre, ej: "voz.mp3". Si lo dejas vacío, usa la voz del celular.
const AUDIO = "";
const FRASES = [
  "Eres más fuerte de lo que crees, Vanessa.",
  "Hoy no tienes que ser perfecta. Con ser tú ya es suficiente.",
  "Tu sonrisa le cambia el día a la gente, incluido el mío.",
  "Lo estás haciendo mejor de lo que piensas.",
  "Si hoy es un día difícil, recuerda que yo estoy de tu lado.",
  "Mereces cosas bonitas, y te van a llegar.",
  "Tu forma de ser hace que todo se sienta más liviano.",
  "Descansar también es avanzar.",
  "Gracias por ser tan buena amiga. De verdad.",
  "Todo lo que te preocupa hoy va a pasar. Tú sigues aquí, brillando.",
  "Tienes un corazón hermoso, no dejes que nadie te haga dudar de eso.",
  "Cada vez que te ríes, el mundo se ve mejor.",
  "Eres de esas personas que uno quiere tener toda la vida.",
  "Respira hondo. Tú puedes con esto y con más.",
  "Me siento muy afortunado de tenerte como amiga."
];
/* ============================= */

document.getElementById('titulo').textContent = "Para ti";
document.getElementById('saludo').textContent = "Querida " + NOMBRE + ",";
document.getElementById('firma').textContent = "Con todo mi cariño, " + TU_NOMBRE + " 🌼";
document.title = "Para ti, " + NOMBRE + " 🌼";

// Rosas amarillas dibujadas (SVG)
let gid = 0;
const ROSA = (x, y, k) => { const id = 'g' + (gid++); return `<g transform="translate(${x} ${y}) scale(${k})"><defs><radialGradient id="${id}" cx=".4" cy=".35"><stop offset="0" stop-color="#fff3a8"/><stop offset=".55" stop-color="#f7c914"/><stop offset="1" stop-color="#d49500"/></radialGradient></defs><circle r="17" fill="url(#${id})"/><path d="M-15 -4c3-9 12-13 20-10 7 3 11 10 9 17" stroke="#b07a00" fill="none" stroke-width="1.2" opacity=".75"/><path d="M-12 6c-2-8 3-15 11-16 8-1 13 5 12 11-1 6-7 9-12 8-5-1-7-5-5-8 2-3 6-3 7 0" stroke="#b07a00" fill="none" stroke-width="1.3"/><path d="M-6 2c0-4 4-6 7-4 3 2 2 6-1 7" fill="#ffe97a" stroke="#c48a00" stroke-width="1"/><ellipse cx="-6" cy="-9" rx="6" ry="3" fill="#fff" opacity=".3" transform="rotate(-25 -6 -9)"/></g>`; };
const RAMO = `<svg viewBox="0 0 120 140" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><ellipse cx="26" cy="50" rx="9" ry="23" transform="rotate(-42 26 50)" fill="#2f7a46"/><ellipse cx="94" cy="50" rx="9" ry="23" transform="rotate(42 94 50)" fill="#2f7a46"/><ellipse cx="60" cy="22" rx="7" ry="16" fill="#3a8a52"/>${ROSA(36,44,1)}${ROSA(84,44,1)}${ROSA(60,30,1.1)}${ROSA(60,62,1)}<path d="M16 64L104 64L66 134Q60 141 54 134Z" fill="#fff1c9"/><path d="M16 64L104 64L98 74L22 74Z" fill="#f0dca0"/><path d="M42 90L78 90" stroke="#e3a600" stroke-width="5" stroke-linecap="round"/></svg>`;
const ROSA_URI = 'data:image/svg+xml,' + encodeURIComponent(`<svg viewBox="-18 -18 36 36" xmlns="http://www.w3.org/2000/svg">${ROSA(0,0,1)}</svg>`);
const PERSONA = `<svg viewBox="0 0 100 190" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><ellipse cx="50" cy="184" rx="28" ry="4" fill="#000" opacity=".3"/><g class="leg l" style="transform-origin:50px 108px"><rect x="40" y="108" width="10" height="68" rx="5" fill="#26324d"/><path d="M36 175h17a3 3 0 0 1 0 7H34a2 2 0 0 1 2-7z" fill="#15151f"/></g><g class="leg r" style="transform-origin:50px 108px"><rect x="51" y="108" width="10" height="68" rx="5" fill="#33436a"/><path d="M47 175h17a3 3 0 0 1 0 7H45a2 2 0 0 1 2-7z" fill="#15151f"/></g><path d="M32 64q0-11 13-11h10q13 0 13 11v50H32z" fill="#2f7a5c"/><path d="M32 100h36v14H32z" fill="#27684d"/><rect x="45" y="46" width="10" height="11" rx="4" fill="#e3b088"/><path d="M33 38c-4 16-2 30 3 36l4-4c-3-9-3-20-1-30z" fill="#3a2418"/><circle cx="50" cy="34" r="16" fill="#f0c6a0"/><path d="M33 33c-1-17 12-22 22-20 11 2 14 12 12 24-1-10-5-14-12-14-8 0-16 2-22 10z" fill="#3a2418"/><circle cx="44" cy="37" r="1.7" fill="#2a1a12"/><circle cx="56" cy="37" r="1.7" fill="#2a1a12"/><path d="M45 44q5 4 10 0" stroke="#a5503c" stroke-width="1.6" fill="none" stroke-linecap="round"/><circle cx="39.5" cy="42" r="2.8" fill="#f4a08a" opacity=".45"/><circle cx="60.5" cy="42" r="2.8" fill="#f4a08a" opacity=".45"/><path d="M62 66q14 6 16 24" stroke="#2f7a5c" stroke-width="9" fill="none" stroke-linecap="round"/><circle cx="78" cy="91" r="5" fill="#f0c6a0"/></svg>`;
document.getElementById('ramo').innerHTML = RAMO;
document.getElementById('ramoFin').innerHTML = RAMO;
document.getElementById('persona').innerHTML = PERSONA;

// Universo con su nombre hecho de estrellas
const cv = document.getElementById('cielo'), cx = cv.getContext('2d');
let W, H, bg = [], nm = [], nombreA = 1, t0 = performance.now();
function crear() {
  W = cv.width = innerWidth; H = cv.height = innerHeight;
  bg = Array.from({length: Math.round(W*H/5000)}, () => ({x: Math.random()*W, y: Math.random()*H, r: Math.random()*1.3 + .3, f: Math.random()*6.3, v: .6 + Math.random()*1.6}));
  const o = document.createElement('canvas'); o.width = W; o.height = 240;
  const c = o.getContext('2d'), fs = Math.min(W*0.3, 130);
  c.font = '600 ' + fs + 'px Caveat, cursive'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#fff';
  c.fillText(NOMBRE, W/2, 120);
  const d = c.getImageData(0, 0, W, 240).data; nm = [];
  for (let y = 0; y < 240; y += 4) for (let x = 0; x < W; x += 4) if (d[(y*W + x)*4 + 3] > 140) nm.push({tx: x, ty: y + 30, x: Math.random()*W, y: Math.random()*H, f: Math.random()*6.3});
  t0 = performance.now();
}
function dibujar(now) {
  cx.clearRect(0, 0, W, H);
  const s = (now - t0)/1000;
  cx.fillStyle = '#fff';
  for (const e of bg) { cx.globalAlpha = .35 + .65*Math.abs(Math.sin(e.f + s*e.v)); cx.beginPath(); cx.arc(e.x, e.y, e.r, 0, 6.3); cx.fill(); }
  const k = Math.min(1, Math.max(0, (s - .4)/3)), ease = 1 - Math.pow(1 - k, 3);
  cx.fillStyle = '#ffe36a';
  for (const e of nm) {
    const x = e.x + (e.tx - e.x)*ease, y = e.y + (e.ty - e.y)*ease, a = (.6 + .4*Math.sin(e.f + s*2))*nombreA;
    cx.globalAlpha = a; cx.beginPath(); cx.arc(x, y, 1.5, 0, 6.3); cx.fill();
    cx.globalAlpha = a*.22; cx.beginPath(); cx.arc(x, y, 3.8, 0, 6.3); cx.fill();
  }
  const ph = (s % 7)/7;
  if (ph < .12) {
    const q = ph/.12, x = W*.92 - q*W*.5, y = H*.08 + q*H*.25, g = cx.createLinearGradient(x, y, x + 70, y - 40);
    g.addColorStop(0, 'rgba(255,255,255,' + (1 - q) + ')'); g.addColorStop(1, 'rgba(255,255,255,0)');
    cx.globalAlpha = 1; cx.strokeStyle = g; cx.lineWidth = 2; cx.beginPath(); cx.moveTo(x, y); cx.lineTo(x + 70, y - 40); cx.stroke();
  }
  cx.globalAlpha = 1;
  requestAnimationFrame(dibujar);
}
Promise.resolve(document.fonts && document.fonts.load('600 60px Caveat')).catch(() => {}).then(() => { crear(); requestAnimationFrame(dibujar); });
let w0 = innerWidth;
addEventListener('resize', () => { if (innerWidth !== w0) { w0 = innerWidth; crear(); } });

// Rosas que caen
const cont = document.getElementById('petalos');
if (!matchMedia('(prefers-reduced-motion:reduce)').matches) {
  for (let i = 0; i < 14; i++) {
    const p = document.createElement('div');
    p.className = 'p';
    p.style.left = Math.random()*100 + 'vw';
    p.style.animationDuration = (7 + Math.random()*8) + 's';
    p.style.animationDelay = (-Math.random()*12) + 's';
    const t = (18 + Math.random()*18) + 'px'; p.style.width = t; p.style.height = t; p.style.backgroundImage = 'url("' + ROSA_URI + '")';
    cont.appendChild(p);
  }
}

// Voz
let voz = null;
function elegirVoz() {
  const vs = speechSynthesis.getVoices();
  const es = vs.filter(v => /^es/i.test(v.lang));
  voz = es.find(v => /natural|neural|online/i.test(v.name))
     || es.find(v => /google/i.test(v.name))
     || es.find(v => /paulina|sabina|monica|mónica|helena|luciana|female/i.test(v.name))
     || es[0] || null;
}
if ('speechSynthesis' in window) { elegirVoz(); speechSynthesis.onvoiceschanged = elegirVoz; }

const lineas = document.getElementById('lineas');
const firma = document.getElementById('firma');
const otra = document.getElementById('otra');
let sesion = 0, audio = null;
const buzon = document.getElementById('buzon');
const sobre = document.getElementById('sobre');
const nota = document.getElementById('nota');
let cola = [];

function fin() {
  otra.style.display = 'inline-block';
  buzon.style.display = 'block';
}

function modoAudio(mi, els) {
  audio = new Audio(AUDIO);
  const poner = () => {
    const d = isFinite(audio.duration) && audio.duration > 0 ? audio.duration : els.length * 6;
    const paso = d / (els.length + 1);
    els.forEach((el, k) => setTimeout(() => {
      if (mi !== sesion) return;
      el.classList.add('v');
      el.scrollIntoView({behavior: 'smooth', block: 'center'});
    }, k * paso * 1000));
  };
  audio.addEventListener('loadedmetadata', poner, {once: true});
  audio.onended = () => { if (mi === sesion) { firma.classList.add('v'); fin(); } };
  audio.play().catch(() => {});
}

sobre.onclick = () => {
  if (!cola.length) cola = FRASES.map((_, i) => i).sort(() => Math.random() - 0.5);
  nota.classList.remove('v');
  void nota.offsetWidth;
  nota.textContent = FRASES[cola.pop()];
  nota.classList.add('v');
  nota.scrollIntoView({behavior: 'smooth', block: 'center'});
};

function hablar(texto, fin) {
  if (!('speechSynthesis' in window)) { setTimeout(fin, 3500); return; }
  const u = new SpeechSynthesisUtterance(texto);
  u.lang = 'es-MX'; if (voz) u.voice = voz;
  u.rate = 0.93; u.pitch = 1.1;
  u.onend = fin; u.onerror = fin;
  speechSynthesis.speak(u);
}

function leer() {
  const mi = ++sesion;
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  lineas.innerHTML = ''; firma.classList.remove('v'); otra.style.display = 'none';
  const els = MENSAJE.map(t => { const d = document.createElement('p'); d.className = 'l'; d.textContent = t; lineas.appendChild(d); return d; });
  buzon.style.display = 'none';
  if (audio) audio.pause();
  if (AUDIO) { modoAudio(mi, els); return; }
  let i = 0;
  (function sig() {
    if (mi !== sesion) return;
    if (i >= els.length) {
      firma.classList.add('v');
      hablar("Con todo mi cariño, " + TU_NOMBRE, () => { if (mi === sesion) fin(); });
      return;
    }
    const el = els[i], t = MENSAJE[i]; i++;
    el.classList.add('v');
    el.scrollIntoView({behavior:'smooth', block:'center'});
    hablar(t, () => setTimeout(sig, 500));
  })();
}

document.getElementById('abrir').onclick = () => {
  document.getElementById('abrir').disabled = true;
  document.getElementById('escena').classList.add('entrega');
  setTimeout(() => {
    document.getElementById('inicio').style.display = 'none';
    document.getElementById('carta').style.display = 'block'; nombreA = .25;
  }, 1700);
  // el toque desbloquea el audio: la voz empieza mientras te entrega el ramo
  if (AUDIO) leer(); else hablar("Esto es para ti, " + NOMBRE, () => setTimeout(leer, 300));
};
setTimeout(() => document.getElementById('abrir').classList.add('ok'), 2800);
otra.onclick = leer;
</script>
</body>
</html>
